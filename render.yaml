# FieldShift 2026 — Render Blueprint Specification
# Single All-in-One Service: Python/FastAPI Web Service serving React 19 SPA + PuLP MILP + Supabase PostgreSQL
# Visiting the single URL https://fieldshift.onrender.com serves both the frontend and the backend API.

services:
  # ===========================================================================
  # ALL-IN-ONE WEB SERVICE: FastAPI + Pre-built React SPA + PuLP MILP + Supabase
  # ===========================================================================
  - type: web
    name: fieldshift
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt -r backend/requirements.txt
    startCommand: python backend/run_migrations.py && python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: Supabase Session Pooler URL
      - key: CORS_ORIGINS
        value: https://fieldshift.onrender.com,https://fieldshift2026.onrender.com,https://fieldshift-backend.onrender.com,http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.onrender\.com$
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard if using AI Assistant
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"

